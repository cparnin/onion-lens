name: Security

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: Static analysis (bandit)
        run: bandit -r src -q
      - name: Dependency audit (pip-audit)
        run: pip-audit
